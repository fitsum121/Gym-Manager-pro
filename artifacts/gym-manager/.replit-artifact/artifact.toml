kind = "mobile"
previewPath = "/"
title = "Gym Manager"
version = "1.0.0"
id = "artifacts/gym-manager"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24634

[services.development]
run = "pnpm --filter @workspace/gym-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gym-manager", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gym-manager", "run", "serve" ]

[services.env]
PORT = "24634"
BASE_PATH = "/"
